name: Build Manager

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - 'manager/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - 'manager/**'
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        id: sign_release
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -not -name "*-signed.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          echo "Signing: $APK"
          # Create a debug keystore on the runner (or use a secret if provided)
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
            KEYSTORE_FILE="release.keystore"
            KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          else
            # Fallback: generate a temporary release keystore
            keytool -genkeypair \
              -alias release-key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "temppass123" -keypass "temppass123" \
              -dname "CN=KernelSU Kitty, OU=Dev, O=Kitty, L=X, ST=X, C=US" \
              -storetype JKS \
              -keystore release.keystore
            KEYSTORE_FILE="release.keystore"
            KEYSTORE_PASSWORD="temppass123"
            KEY_ALIAS="release-key"
            KEY_PASSWORD="temppass123"
          fi
          # Sign using apksigner from the Android SDK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -1)
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "${APK%.apk}-signed.apk" \
            "$APK"
          echo "signed_apk=${APK%.apk}-signed.apk" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Manager-debug
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Manager-release
          path: manager/app/build/outputs/apk/release/*-signed.apk
          if-no-files-found: error
          retention-days: 30
